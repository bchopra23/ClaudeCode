<html lang="en">
<head>

<title>The Edge Beyond More — Expanded Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --parch:#F5EDD8;--parch2:#EDE3C8;--ink:#1C1008;--ink2:#3C2C18;--inkl:#6B4C32;
  --rust:#7A2E0E;--gold:#C9A84C;--goldl:#E2C97E;--spine:#5C3A18;--navy:#0F1624;--navym:#1A2540;
}
html,body{width:100%;min-height:100vh;background:radial-gradient(ellipse at 50% 35%,#1e2d47 0%,#0d1828 55%,#060a12 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 12px;font-family:'EB Garamond',Georgia,'Palatino Linotype',serif;overflow-x:hidden}

/* ─ META LABEL ─ */
.metalabel{font-size:9px;letter-spacing:4px;color:rgba(201,168,76,.4);text-transform:uppercase;margin-bottom:14px;text-align:center;font-family:Georgia,serif}

/* ─ BOOK SHADOW WRAPPER ─ */
.book-shadow-wrap{
  width:820px;max-width:calc(100vw - 24px);
  box-shadow:0 35px 110px rgba(0,0,0,.75),0 8px 30px rgba(0,0,0,.5),0 0 0 1px rgba(120,90,40,.25);
  border-radius:3px 9px 9px 3px;
  position:relative;
}

/* ─ SCENE (perspective) ─ */
.scene{perspective:2800px;perspective-origin:50% 45%;width:100%}

/* ─ BOOK ─ */
.book{
  position:relative;width:100%;height:560px;
  display:flex;transform-style:preserve-3d;
  border-radius:3px 9px 9px 3px;overflow:visible;
}
@media(max-width:860px){.book{height:480px}}
@media(max-width:540px){.book{height:390px}}

/* ─ MOBILE: SINGLE COLUMN, NO CUTOFF ─ */
@media(max-width:640px){
  .book{height:auto!important;flex-direction:column;border-radius:6px}
  .pa{width:100%!important;overflow:visible!important;height:auto!important}
  .pa.L{border-radius:6px 6px 0 0;box-shadow:inset 0 -4px 14px rgba(0,0,0,.07)}
  .pa.R{border-radius:0 0 6px 6px;box-shadow:inset 0 4px 14px rgba(0,0,0,.04)}
  .pc{overflow:visible!important;height:auto!important}
  .p{padding:20px 16px 22px;min-height:0!important}
  .p.dk,.p.dm{min-height:260px!important;height:auto!important}
  .spine{display:none}
  #fl{display:none!important}
  .rdeco{font-size:72px;top:10px;right:10px}
  h1.bt{font-size:32px}
  h2.ct{font-size:17px}
  h3.pt{font-size:22px}
  p.b{font-size:13.5px;line-height:1.75}
  p.b.sm{font-size:12px}
  .cn{font-size:40px}
  .vt{font-size:12px}
  .vi{font-size:10.5px}
  .kd{font-size:11px}
  .cf p{font-size:11px}
  .pb li{font-size:11.5px}
  .ab p{font-size:11px}
  .tbl{font-size:11px;padding:8px 10px}
  .pn{display:none}
  .controls{gap:14px;margin-top:14px}
  .nbtn{width:48px;height:48px;font-size:18px}
  .progbar{width:100%}
  .hint{font-size:8px;letter-spacing:2px}
  .book-shadow-wrap{border-radius:6px}
}

/* ─ PAGE AREAS ─ */
.pa{width:50%;height:100%;overflow:hidden;position:relative;background:var(--parch)}
.pa.L{border-radius:3px 0 0 3px;box-shadow:inset -6px 0 18px rgba(0,0,0,.08)}
.pa.R{border-radius:0 9px 9px 0;box-shadow:inset 6px 0 18px rgba(0,0,0,.05)}

/* ─ SPINE ─ */
.spine{position:absolute;left:50%;top:0;bottom:0;width:10px;transform:translateX(-50%);z-index:6;background:linear-gradient(to right,#3a200a 0%,var(--spine) 30%,#c9a87a 50%,var(--spine) 70%,#3a200a 100%);box-shadow:0 0 12px rgba(0,0,0,.4)}

/* ─ PAGE CONTAINERS ─ */
.pc{width:100%;height:100%;overflow:hidden;position:relative}

/* ─ FLIPPER ─ */
#fl{position:absolute;right:0;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;display:none;z-index:10}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.ff.bk{transform:rotateY(180deg)}

/* ─ PAGE INNER (set via innerHTML) ─ */
.p{min-height:100%;padding:30px 32px 28px;background:var(--parch);position:relative;color:var(--ink)}
.p.dk{background:var(--navy);color:#E8DAC0}
.p.dm{background:linear-gradient(145deg,#192038 0%,#0f1624 100%);color:#E8DAC0}

/* ─ RUNNING HEADER ─ */
.rh{font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:#A08060;border-bottom:1px solid #D4B896;padding-bottom:7px;margin-bottom:16px;display:flex;justify-content:space-between;font-family:Georgia,serif}
.rh.lt{color:rgba(201,168,76,.35);border-color:rgba(201,168,76,.12)}

/* ─ CHAPTER NUMBER (deco) ─ */
.cn{font-family:'Playfair Display','Palatino Linotype',serif;font-size:52px;font-weight:900;color:#EAE0CC;line-height:1;margin-bottom:2px;letter-spacing:-1px}
.cn.lt{color:rgba(201,168,76,.12);font-size:72px}

/* ─ TITLES ─ */
h1.bt{font-family:'Playfair Display','Palatino Linotype',serif;font-size:40px;font-weight:900;line-height:1.05;color:#E8DAC0;margin-bottom:8px}
h2.ct{font-family:'Playfair Display','Palatino Linotype',serif;font-size:17px;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:3px}
h2.ct.lt{color:#F0E6D0}
.cs{font-size:11.5px;color:var(--rust);font-style:italic;letter-spacing:.3px;margin-bottom:13px}
.cs.lt{color:var(--goldl);opacity:.75}
.pl{font-size:9px;letter-spacing:3px;color:rgba(201,168,76,.45);text-transform:uppercase;margin-bottom:8px;font-family:Georgia,serif}
h3.pt{font-family:'Playfair Display','Palatino Linotype',serif;font-size:28px;font-weight:700;color:#F0E6D0;line-height:1.2;margin-bottom:14px}
.pd{font-size:13px;color:rgba(215,195,165,.6);font-style:italic;line-height:1.8;border-left:2px solid rgba(201,168,76,.18);padding-left:13px}
.rdeco{font-family:'Playfair Display',serif;font-size:110px;font-weight:900;color:rgba(201,168,76,.06);line-height:1;position:absolute;top:16px;right:16px;pointer-events:none;user-select:none}

/* ─ BODY TEXT ─ */
p.b{font-size:14px;line-height:1.78;color:var(--ink2);margin-bottom:9px;text-align:justify;hyphens:auto}
p.b.lt{color:rgba(215,195,165,.8)}
p.b.sm{font-size:12.5px;line-height:1.7;margin-bottom:8px}
.sk{font-style:italic;color:var(--rust)}

/* ─ KEYWORD BOX ─ */
.kw{border-left:3px solid var(--gold);padding:8px 11px;margin:9px 0;background:rgba(201,168,76,.07);border-radius:0 3px 3px 0}
.kt{font-family:'Playfair Display',serif;font-size:11.5px;color:var(--rust);font-style:italic;font-weight:700;margin-bottom:2px}
.kd{font-size:12px;color:#4A3A28;line-height:1.55}

/* ─ VERSE BOX ─ */
.vb{text-align:center;padding:10px 8px;margin:9px 0;border-top:1px solid #C9AA8C;border-bottom:1px solid #C9AA8C}
.vi{font-size:11.5px;color:#A08060;font-style:italic;line-height:1.7;margin-bottom:5px}
.vt{font-size:13px;font-style:italic;color:var(--ink2);line-height:1.6}
.vr{font-size:9.5px;color:#A08060;margin-top:4px;letter-spacing:.5px}

/* ─ PULL QUOTE ─ */
.pq{text-align:center;padding:11px 10px;margin:9px 0}
.pq p{font-family:'Playfair Display',serif;font-size:14px;font-style:italic;color:var(--ink2);line-height:1.6;margin-bottom:5px}
.pq cite{font-size:9.5px;color:#A08060;letter-spacing:1px;text-transform:uppercase}
.pq.lt p{color:rgba(215,195,165,.8)}

/* ─ PRACTICE BOX ─ */
.pb{background:rgba(122,46,14,.06);border:1px solid rgba(122,46,14,.16);border-radius:3px;padding:9px 11px;margin:9px 0}
.pt2{font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--rust);margin-bottom:6px;font-family:Georgia,serif}
.pb ul{list-style:none}
.pb li{font-size:12px;color:#3A2C1C;line-height:1.55;padding-left:13px;position:relative;margin-bottom:4px}
.pb li::before{content:'◆';position:absolute;left:0;color:var(--rust);font-size:7px;top:5px}

/* ─ AMBITIOUS BOX ─ */
.ab{background:var(--parch2);border-top:2px solid #C9AA8C;padding:9px 11px;margin:9px 0}
.at{font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:#6B4C32;margin-bottom:5px;font-family:Georgia,serif}
.ab p{font-size:12px;color:#3A2C1C;line-height:1.6}

/* ─ CASE FILE BOX (real-world examples) ─ */
.cf{background:rgba(15,22,36,.045);border:1px solid rgba(15,22,36,.12);border-left:3px solid var(--navym);border-radius:0 3px 3px 0;padding:8px 12px;margin:9px 0}
.cft{font-size:8px;letter-spacing:1.8px;text-transform:uppercase;color:var(--navym);margin-bottom:5px;font-family:Georgia,serif;display:flex;justify-content:space-between;align-items:baseline}
.cft .nm{font-family:'Playfair Display',serif;font-style:italic;letter-spacing:.3px;font-size:11.5px;text-transform:none;color:var(--rust);font-weight:700}
.cf p{font-size:11.5px;color:#3A2C1C;line-height:1.55;margin-bottom:0}

/* ─ INFO TABLE ─ */
.tbl{background:var(--parch2);border:1px solid #D4B896;border-radius:4px;padding:10px 13px;margin:9px 0;font-size:12px;line-height:1.72;color:#3A2C1C}
.tr2{margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #E0D0B8}
.tr2:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}

/* ─ TOC STYLES ─ */
.tpl{font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--rust);margin:10px 0 4px;font-family:Georgia,serif}
.tr{font-size:12px;color:var(--ink2);padding:1.5px 0;display:flex;gap:8px;align-items:baseline}
.tch{color:#A08060;font-size:10px;min-width:22px;flex-shrink:0}

/* ─ DIVIDER ─ */
.dv{text-align:center;color:#C9AA8C;margin:7px 0;font-size:12px;letter-spacing:3px}

/* ─ PAGE NUMBER ─ */
.pn{position:absolute;bottom:12px;font-size:10px;color:#B09978;letter-spacing:1px;font-family:Georgia,serif}
.pn.l{left:32px}.pn.r{right:32px}

/* ─ CONTROLS ─ */
.controls{display:flex;align-items:center;gap:22px;margin-top:16px}
.nbtn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(201,168,76,.22);background:transparent;color:rgba(201,168,76,.65);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:sans-serif}
.nbtn:hover:not(:disabled){background:rgba(201,168,76,.09);border-color:rgba(201,168,76,.55);color:var(--goldl)}
.nbtn:disabled{opacity:.2;cursor:default}
.ctr{color:rgba(201,168,76,.38);font-size:11px;letter-spacing:3px;min-width:72px;text-align:center;font-family:Georgia,serif}
.progbar{width:820px;max-width:calc(100vw - 24px);height:1px;background:rgba(255,255,255,.06);margin-top:9px;position:relative}
.progfill{position:absolute;left:0;top:0;height:100%;background:linear-gradient(to right,var(--rust),var(--gold));transition:width .4s ease}
.hint{margin-top:7px;font-size:9px;letter-spacing:3px;color:rgba(201,168,76,.18);text-transform:uppercase;text-align:center}
</style>
</head>

// ── SPREAD 0: COVER ──────────────────────────────────────────
add(
`<div class="p dk" style="display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-height:100%">
  <div style="font-size:9px;letter-spacing:3px;color:rgba(201,168,76,.3);text-transform:uppercase;margin-bottom:18px;font-family:Georgia,serif">Hare Kṛṣṇa Hare Kṛṣṇa · Kṛṣṇa Kṛṣṇa Hare Hare</div>

  <p style="font-size:12px;color:rgba(200,184,154,.45);line-height:1.9;font-style:italic">A narrative guide to the teachings of<br>His Divine Grace A.C. Bhaktivedanta<br>Swami Prabhupāda — told as a story,<br>kept in its own language, written<br>for the ambitious.</p>

</div>`,
`<div class="p dk" style="display:flex;flex-direction:column;justify-content:center;height:100%;min-height:100%">
  <div style="font-size:8.5px;letter-spacing:4px;color:rgba(201,168,76,.38);text-transform:uppercase;margin-bottom:18px;font-family:Georgia,serif">Ancient Wisdom for the Driven</div>
  <h1 class="bt" style="font-size:42px">The Edge<br><span style="font-size:54px;letter-spacing:-2px">Beyond</span><br>More</h1>
  <div style="width:52px;height:2px;background:linear-gradient(to right,#7A2E0E,#C9A84C);margin:16px 0"></div>
  <p style="font-size:15px;color:rgba(200,184,154,.6);font-style:italic;line-height:1.65">the war you can't win<br>by winning</p>
  <p style="margin-top:22px;font-size:8.5px;color:rgba(201,168,76,.3);letter-spacing:2px;text-transform:uppercase;font-family:Georgia,serif">Expanded Edition · with case files from the field</p>
  <p style="position:absolute;bottom:26px;right:32px;font-size:9px;color:rgba(201,168,76,.2);letter-spacing:2px;text-transform:uppercase;font-family:Georgia,serif">click → to begin</p>
</div>`
);

// ── SPREAD 1: NOTE + MAP ─────────────────────────────────────
add(
`<div class="p">
  <div class="rh"><span>A Note Before the Battle</span><span>The Edge Beyond More</span></div>
  <h2 class="ct">A Note Before the Battle</h2>
  <div class="cs">how to read what follows</div>
  <p class="b">There is a moment, on a battlefield five thousand years ago, that every ambitious person eventually lives through in their own way. The greatest warrior of his age stands between two armies, bow in hand — and he cannot move. His hands shake. His mouth goes dry. The skill is all there. The will has simply collapsed.</p>
  <p class="b">His name is Arjuna. The voice that talks him back onto his feet belongs to Kṛṣṇa — his charioteer, his closest friend, and, the text insists, the Supreme Person wearing the disguise of a charioteer. What passes between them across seven hundred verses is not a sermon about retreating from life. It is the most practical conversation ever recorded about how to act — fully, fearlessly — when everything is on the line and every instinct says to fold.</p>
  <p class="b">This book retells that conversation, and this expanded edition pins each idea to the field — to athletes, founders, and the research that, thousands of years late, keeps confirming it. Its teacher in our century was A.C. Bhaktivedanta Swami Prabhupāda, who carried the Gītā out of Sanskrit into the modern world with a clarity nobody had managed before.</p>
  <div class="pq"><p>"I am not asking you to believe. I am asking you to become a little thoughtful. Test it, and see for yourself."</p><cite>— Śrīla Prabhupāda</cite></div>
  <span class="pn l">1</span>
</div>`,
`<div class="p">

  <div class="cs">diagnosis → philosophy → practice → long game → the turn</div>

  <div class="tr"><span class="tch">6</span><span>The Law Nobody Repealed — karma, cause and effect at scale</span></div>

  <div class="tr"><span class="tch">10</span><span>The Mind Gym — japa, the focus practice that holds</span></div>
  <div class="tr"><span class="tch">11</span><span>The Operator's Day — sādhana, structure for output and calm</span></div>
  <div class="tr"><span class="tch">12</span><span>Craving, Anger, and the Crash — the chain of self-sabotage</span></div>
  <div class="tpl">Parts IV–VI · plus "In the Field" case files throughout</div>
  <div class="tr"><span class="tch">13–15</span><span>The Source Code — the Gītā, the founder, the lineage</span></div>

// ── SPREAD 2: PART I + CH.1 ──────────────────────────────────
add(
`<div class="p dm" style="display:flex;flex-direction:column;justify-content:center;min-height:100%;position:relative">
  <div class="rdeco">I</div>
  <div class="pl">Part I</div>
  <h3 class="pt">The<br>Diagnosis</h3>
  <div class="pd">No remedy makes sense until the disease is named. And the disease was never that you didn't have enough.<br><br>Three chapters. Three things most high performers get wrong about themselves — and don't know to look for.</div>
  <div style="margin-top:18px;font-size:8.5px;letter-spacing:2px;color:rgba(201,168,76,.22);text-transform:uppercase;font-family:Georgia,serif;line-height:2">1 · Why the win never lands<br>2 · Identity beneath the scoreboard<br>3 · The physics of your moods</div>
  <span class="pn l" style="color:rgba(180,150,100,.25)">3</span>
</div>`,
`<div class="p">
  <div class="rh"><span>Chapter 1</span><span>Part I · The Diagnosis</span></div>
  <div class="cn">1</div>
  <h2 class="ct">The Man Who Has Everything</h2>
  <div class="cs">why the win never lands</div>
  <p class="b">Begin not on the battlefield but in a penthouse, because that is the version of the story you already know. A man has done it. The number he set ten years ago — the one that was finally going to mean he had arrived — he has passed it. The car is in the garage. The name is known. And he is standing at the window at eleven at night, thumbing his phone for something he cannot name, feeling the particular emptiness that only arrives after the win. Never before.</p>
  <p class="b">He would never say it aloud. But the thought is there: <em>Is this it?</em></p>
  <p class="b">This is the same freeze as Arjuna's, wearing a better suit. Both men have run magnificently. Both have arrived somewhere that does not satisfy. The Gītā is the diagnosis of exactly this, and it is merciless about the mechanism.</p>
  <p class="b">The mechanism is <span class="sk">kāma</span> — material desire, not as a moral failing but as a physical process with a known shape. Satisfying a desire does not end it. It enlarges it.</p>
  <div class="kw"><div class="kt">kāma (kā-ma)</div><div class="kd">Material desire — the appetite for sense enjoyment that grows by being fed, not satisfied. The fire that is not quenched by fuel, but enlarged by it. Kṛṣṇa calls it the eternal enemy of the wise.</div></div>
  <span class="pn r">4</span>
</div>`
);

// ── SPREAD 3: CH.1 CONT. + CH.1 CASE FILE ───────────────────
add(
`<div class="p">
  <div class="rh"><span>Chapter 1 · continued</span><span>The Man Who Has Everything</span></div>
  <div class="vb"><div class="vi">kāma-rūpeṇa kaunteya · duṣpūreṇānalena ca</div><div class="vt">"…by desire — which is never satisfied and which burns like fire."</div><div class="vr">Bhagavad-gītā 3.39</div></div>
  <p class="b">Read that as engineering, not poetry. Fire is not quenched by fuel; it is fed by it. The blaze grows, the appetite for fuel grows with it, and the fire's only description of itself is <em>not enough yet.</em> Modern psychology rediscovered this and named it the hedonic treadmill — satisfaction resets to baseline almost as fast as you reach it, leaving you to chase a line that retreats as you approach.</p>
  <p class="b">Here is the crucial move that separates this from every lazy lecture about 'wanting less.' Kṛṣṇa does not tell Arjuna his drive is the problem. He tells him it is <em>pointed wrong</em> — that the same energy, redirected, is the very thing that will carry him across. The problem was never the engine. The engine is a gift. The problem is that it has been aimed at a target which, by its nature, recedes the instant you arrive.</p>
  <div class="ab"><div class="at">For the Ambitious</div><p>You have already run this experiment, probably several times. You hit the goal, and the feeling evaporated inside a week — so you set a bigger one. The Gītā offers not a smaller life but the discovery that your engine was never the problem. <strong>Keep the drive. Re-aim it.</strong></p></div>
  <span class="pn l">5</span>
</div>`,
`<div class="p">
  <div class="rh"><span>Chapter 1 · In the Field</span><span>The Arrival Fallacy</span></div>
  <h2 class="ct">"Is This It?" — On the Record</h2>
  <div class="cs">people who reached the top, and said the quiet part out loud</div>
  <p class="b">The Gītā says the win does not land. You do not have to take its word. Listen to the people who reached the summit the culture promised would be enough — and then described the view.</p>
  <div class="cf"><div class="cft"><span>Three Super Bowl rings</span><span class="nm">Tom Brady</span></div><p>At the height of his career he told an interviewer: "Why do I have three Super Bowl rings and still think there's something greater out there for me? I reached my goal, my dream, my life. Me, I think: it's gotta be more than this." Asked what the answer was, he said: "I wish I knew."</p></div>
  <div class="cf"><div class="cft"><span>Global fame and fortune</span><span class="nm">Jim Carrey</span></div><p>"I think everybody should get rich and famous and do everything they ever dreamed of — so they can see that it's not the answer." The freeze, reported back from the far side of <em>more.</em></p></div>
  <div class="cf"><div class="cft"><span>World No. 1 in tennis</span><span class="nm">Andre Agassi</span></div><p>His memoir opens: "I play tennis for a living, even though I hate tennis." The achievement and the emptiness, sitting in the same sentence.</p></div>
  <p class="b sm">And the research agrees: in a landmark 1978 study, major lottery winners — people handed the literal jackpot — were, within months, no happier than ordinary people. The number lands. The feeling does not.</p>
  <span class="pn r">6</span>
</div>`
);

add(
`<div class="p">
  <div class="rh"><span>Chapter 2</span><span>Part I · The Diagnosis</span></div>
  <div class="cn">2</div>
  <h2 class="ct">You Are Not Your Resume</h2>
  <div class="cs">ātmā — identity beneath the scoreboard</div>
  <p class="b">Ask a driven man who he is and he will hand you a résumé. What he does, what he has built, what he is worth, who he knows. It is an efficient answer and a dangerous one — because the moment your identity is your achievements, every setback stops being a business problem and becomes an attack on your existence.</p>
  <p class="b">This is the open secret of high performers. So many are profoundly anxious precisely because they are not defending a position — they are defending a <em>self.</em> Lose the position and the self goes with it. Arjuna's breakdown in Chapter One is exactly this: not about strategy, but about identity dissolving under pressure.</p>
  <p class="b">Kṛṣṇa's first move, before any instruction about duty or action, is to attack the root. He tells Arjuna he has fundamentally misunderstood who he is.</p>
  <div class="vb"><div class="vi">na tv evāhaṁ jātu nāsaṁ · na tvaṁ neme janādhipāḥ</div><div class="vt">"Never was there a time when I did not exist, nor you, nor all these kings; nor in future shall any of us cease to be."</div><div class="vr">Bhagavad-gītā 2.12</div></div>
  <p class="b">The claim is radical: you are not your body, and you are not your mind. You are the conscious witness that <em>has</em> a body and <em>uses</em> a mind. The Sanskrit word is <span class="sk">ātmā.</span></p>
  <div class="kw"><div class="kt">ātmā (āt-mā)</div><div class="kd">The eternal self — the conscious witness that inhabits body and mind but is distinct from both. The part of you no result, no review, no rival can ever touch.</div></div>
  <span class="pn l">7</span>
</div>`,
`<div class="p">
  <div class="rh"><span>Chapter 2 · continued</span><span>You Are Not Your Resume</span></div>
  <p class="b">To make the distinction unmistakable, the tradition hands you the single clearest picture of the human being in all of Indian philosophy — the image of the chariot, drawn from the Kaṭha Upaniṣad and beloved of Prabhupāda.</p>
  <div class="tbl">
    <div style="font-family:'Playfair Display',serif;font-size:12px;letter-spacing:.5px;color:var(--rust);margin-bottom:9px">THE CHARIOT OF THE BODY</div>
    <div class="tr2"><strong>Ātmā</strong> — the passenger; the real you; the conscious witness behind everything</div>
    <div class="tr2"><strong>Buddhi</strong> — intelligence; the charioteer who is meant to steer</div>
    <div class="tr2"><strong>Manas</strong> — the mind; the reins — impulsive, yanked about by every like and dislike</div>
    <div><strong>Indriya</strong> — the senses; five powerful horses chasing their sense-objects</div>
  </div>
  <p class="b">You are not the chariot — you are the <em>passenger.</em> When the charioteer (intelligence) is asleep and the reins hang slack, the horses bolt and the passenger is dragged anywhere they please. When the charioteer is awake and the reins are firm, those same horses become tremendous power, aimed.</p>
  <p class="b">The same mind is friend or enemy depending only on who holds the reins — a point Kṛṣṇa makes flatly:</p>
  <div class="vb"><div class="vt">"For him who has conquered the mind, the mind is the best of friends; but for one who has failed to do so, his very mind will be the greatest enemy."</div><div class="vr">Bhagavad-gītā 6.6</div></div>
  <span class="pn r">8</span>
</div>`

add(
`<div class="p">
  <div class="rh"><span>Chapter 2 · In the Field</span><span>When the Scoreboard Was the Self</span></div>
  <h2 class="ct">The Self That Couldn't Survive Retirement</h2>
  <div class="cs">what happens when identity and résumé are the same thing</div>
  <p class="b">If your self is your scoreboard, what happens the day the scoreboard goes dark? The most decorated performers alive have answered, and the answer is sobering.</p>
  <div class="cf"><div class="cft"><span>23 Olympic golds</span><span class="nm">Michael Phelps</span></div><p>The most decorated Olympian in history has spoken openly about the depression that followed his Games — at one point, he has said, he did not want to be alive. The medals were never the problem. Building an entire self on top of them was.</p></div>
  <div class="cf"><div class="cft"><span>Emperor of Rome</span><span class="nm">Marcus Aurelius</span></div><p>The most powerful man in the world spent his nights writing reminders to himself that station, fame, and applause were external and not <em>him.</em> The Stoic "inner citadel" is Kṛṣṇa's passenger by another name — the watcher no title can touch.</p></div>
  <p class="b">Elite performers eventually describe some version of the same discovery: the separation of self-worth from results is the thing that finally lets a person perform under real pressure. You can compete ferociously and lose without annihilation. You can be savaged in a meeting without it reaching the core.</p>
  <div class="pq"><p>"The Gītā simply got there first — and explained the mechanism instead of leaving it to instinct."</p></div>

</div>`,
`<div class="p">
  <div class="rh"><span>Chapter 3</span><span>Part I · The Diagnosis</span></div>
  <div class="cn">3</div>
  <h2 class="ct">The Three Gears</h2>
  <div class="cs">tri-guṇa — the physics of your moods</div>
  <p class="b">Every operator tracks their own state obsessively — the difference between a morning when the work flows and one when it is like dragging a car uphill. The Gītā has a model for exactly this. It says all activity, and every mood that drives it, runs in one of three modes — three <span class="sk">guṇas</span> — three gears your nervous system is always in. Knowing which gear you are in, and how to shift, is most of the game of managing yourself.</p>
  <div class="tbl">
    <div class="tr2"><strong style="color:var(--rust)">Tamas</strong> — inertia; the fog, the can't-start heaviness, the doom-scroll. Output near zero. You know it, which makes you feel worse, which deepens the gear.</div>
    <div class="tr2"><strong style="color:var(--rust)">Rajas</strong> — passionate drive; hustle, urgency, ambition. Feels like productivity — and often is — but it is restless by nature and never satisfied. <em>Most high achievers are stuck here and have mistaken it for their personality.</em></div>
    <div><strong style="color:var(--gold)">Sattva</strong> — clarity; calm focus, sound judgment, the state athletes call flow. Decisions made here are simply better. Spend more time here.</div>
  </div>
  <p class="b">The gears are not you. They are weather moving through; you are the sky it moves through. And critically, they are not fixed. What you eat, who you spend time with, what you pour into your eyes and ears, how you sleep — all of it pushes you up or down between gears.</p>
  <span class="pn r">10</span>
</div>`
);

  <p class="b">The flow state that athletes and performers chase — what the psychologist Mihály Csíkszentmihályi spent his career documenting, the absorbed, effortless, time-dissolving best of human performance — is, in this language, simply <em>sattva</em> held long enough to work in. The Gītā's contribution is to tell you it is a gear you can engineer toward, not a mood you must wait for.</p>

  <p class="b">The tradition describes a state beyond even sattva — called <span class="sk">śuddha-sattva</span>, pure goodness — which is the platform of genuine devotion. The daily practices in Part III are, in the end, a protocol for climbing through the gears toward this steadier state.</p>

`<div class="p">
  <div class="rh"><span>Chapter 4</span><span>Part II · The Operating System</span></div>
  <div class="cn">4</div>
  <h2 class="ct">The Source</h2>
  <div class="cs">Kṛṣṇa — God modelled as total competence</div>
  <p class="b">Most ambitious people keep the word God in a locked drawer they don't open during working hours. Either they discarded it in adolescence, or they hold it vaguely — a warm fog labelled "the universe." What makes Prabhupāda's presentation arresting is how flatly it refuses the fog. He would not allow God to be an abstraction. He insisted the ultimate reality is a <em>person</em> — with a name, Kṛṣṇa, meaning "the all-attractive" — defined not with sentiment but with a specification.</p>
  <div class="kw"><div class="kt">Bhagavān (bha-ga-vān)</div><div class="kd">"The possessor of all opulence" — God as the supreme person, complete in six qualities: total wealth, total strength, total fame, total beauty, total knowledge, and total renunciation.</div></div>
  <p class="b">Read those six qualities as a competitor's balance sheet: money, power, status, beauty, knowledge — and the last one, freedom from needing any of it. Prabhupāda's argument: every drive in you is a small, leaking instance of a complete original. You hunger for wealth because wealth is real and good. You are simply drinking from a puddle while standing beside an ocean.</p>
  <div class="vb"><div class="vi">ahaṁ sarvasya prabhavo · mattaḥ sarvaṁ pravartate</div><div class="vt">"I am the source of all spiritual and material worlds. Everything emanates from Me. The wise who know this engage in My devotional service with all their hearts."</div><div class="vr">Bhagavad-gītā 10.8</div></div>
  <span class="pn l">14</span>
</div>`
);

// ── SPREAD 8: CH.4 CONT + CH.5 ──────────────────────────────
add(
`<div class="p">
  <div class="rh"><span>Chapter 4 · continued</span><span>The Source</span></div>
  <p class="b">The tradition then adds the line that changes the whole relationship: you are not separate from this source — and not identical to it either. You are part of it, as a spark is part of a fire: same in nature, vastly different in scale. The spark has all the qualities of the fire, in miniature. Your hunger for greatness is not a flaw to be ashamed of. It is a memory of where you came from.</p>
  <p class="b">This reframes every craving you have. The drive for wealth is a leaking instance of total opulence. The drive for recognition, a leaking instance of total fame. The drive to be irresistible, a fragment of total beauty. None of these appetites is wrong. Each is simply aimed at the puddle when the ocean is the same direction, only further.</p>
  <div class="ab"><div class="at">For the Ambitious</div><p>You are not being told your wants are bad. You are being told they are <em>too small</em> — that you have been settling for tokens of things that exist somewhere in full. <strong>Trace each desire back to its source and you stop being ashamed of your ambition and start aiming it correctly.</strong></p></div>
  <p class="b">Whether or not you grant the metaphysics tonight, the structural claim is worth holding: the things you chase are real goods, pointing somewhere. The question Part II forces is simply — pointing <em>where?</em></p>
  <span class="pn l">15</span>
</div>`,
`<div class="p">
  <div class="rh"><span>Chapter 5</span><span>Part II · The Operating System</span></div>
  <div class="cn">5</div>
  <h2 class="ct">The Real Leaderboard</h2>
  <div class="cs">puruṣārthas — the four prizes of life, and the fifth</div>
  <p class="b">The Vedic tradition is not anti-success. It is almost aggressively pro-success — it merely insists on knowing which success you mean, and putting the kinds in order. It names four legitimate aims of human life, the <span class="sk">puruṣārthas</span>, arranged from base to peak, and then adds a fifth that outranks them all.</p>
  <div class="tbl">
    <div class="tr2"><strong style="color:var(--inkl)">Dharma</strong> — integrity, right action; the foundation everything else rests on. Remove it and the whole tower leans.</div>
    <div class="tr2"><strong style="color:var(--inkl)">Artha</strong> — wealth and power; fully endorsed. Not one ounce of romance about poverty.</div>
    <div class="tr2"><strong style="color:var(--inkl)">Kāma</strong> — enjoyment; legitimate, within the code. The tradition is not asking you to go numb.</div>
    <div class="tr2"><strong style="color:var(--inkl)">Mokṣa</strong> — liberation from the anxious machinery. The prize most philosophies call the summit.</div>
    <div><strong style="color:var(--gold)">Prema</strong> — pure love of the source; positive, active, engaged. <em>Above even freedom.</em> The actual summit.</div>
  </div>
  <p class="b">Then the Gītā does something almost cheeky: it says freedom — mokṣa, the prize the philosophers crown — is not the top. Freedom is a negative: the absence of bondage, an empty and silent room. Above it sits <span class="sk">prema</span> — a positive, fully engaged love for the source. Not checking out of the game, but playing it from love instead of fear.</p>
  <span class="pn r">16</span>
</div>`
);

// ── SPREAD 9: CH.5 CONT + CH.6 ──────────────────────────────
add(
`<div class="p">
  <div class="rh"><span>Chapter 5 · continued</span><span>The Real Leaderboard</span></div>
  <p class="b">Notice the architecture. The bottom two prizes — wealth and enjoyment — are exactly the two the modern world tells you to maximise, and exactly the two the man in the penthouse already has. The diagnosis of Chapter One, restated as a stack diagram: he cleared the bottom two layers and was told that was the whole tower. Of course it didn't feel like arriving. He was standing on the second floor of a five-storey building, wondering why the view was disappointing.</p>
  <div class="ab"><div class="at">For the Ambitious</div><p>You are allowed to want the money. The tradition says nothing about renouncing ambition. It says you have been running a four-layer stack with the top two layers missing — which is why clearing the bottom two never feels like arriving. <strong>Build all of it, in order.</strong></p></div>
  <p class="b">And the order matters as much as the contents. Dharma — integrity — is the foundation; wealth and pleasure pursued without it are a tower built on sand, which is the story of every spectacular collapse you have ever read about. Build the floors in sequence, and each one holds the weight of the next.</p>
  <span class="pn l">17</span>
</div>`,
`<div class="p">
  <div class="rh"><span>Chapter 6</span><span>Part II · The Operating System</span></div>
  <div class="cn">6</div>
  <h2 class="ct">The Law Nobody Repealed</h2>
  <div class="cs">karma — cause and effect at scale</div>
  <p class="b">Strip karma of its bumper-sticker residue and what remains is something a hard-nosed rationalist already believes: actions have consequences, and consequences find their way back to the one who acted. The tradition's contribution is not to invent this — it is to take it fully seriously, across a longer horizon than a single quarter.</p>
  <p class="b">But the operational edge is not the cosmic bookkeeping. It is the reframe of how you hold your own actions. Most people act for the result and treat the action itself as a toll grudgingly paid to reach it. Kṛṣṇa inverts this completely. You have total authority over your actions, and zero ownership of their results — because results depend on forces outside any one person. Therefore: pour everything into the action, and release your grip on the outcome.</p>
  <div class="vb"><div class="vi">karmaṇy evādhikāras te · mā phaleṣu kadācana</div><div class="vt">"You have a right to perform your duty, but you are not entitled to the fruits of action. Never consider yourself the cause of results, and never be attached to not doing your duty."</div><div class="vr">Bhagavad-gītā 2.47 — the hinge the whole practical half turns on</div></div>
  <p class="b">Sit with how strange and modern this is. It is, word for word, what sports psychologists drill into elite athletes and what calm founders learn the hard way.</p>
  <span class="pn r">18</span>
</div>`
);

// ── SPREAD 10: CH.6 CASE FILE + CH.7 ────────────────────────
add(
`<div class="p">
  <div class="rh"><span>Chapter 6 · In the Field</span><span>Control the Process, Release the Score</span></div>
  <h2 class="ct">2.47, Rediscovered Everywhere</h2>
  <div class="cs">the people who win by not chasing the win</div>
  <p class="b">Attachment to the result introduces fear. Fear degrades execution. Degraded execution produces worse results — which deepens the attachment. It is a loop, and it tightens. The most consistent winners in modern life have all, independently, found the same exit: control the process, release the score.</p>
  <div class="cf"><div class="cft"><span>Six national titles</span><span class="nm">Nick Saban — "The Process"</span></div><p>The most successful college football coach of his era forbade his teams to think about winning the championship. The instruction was almost monastic: do not look at the scoreboard, do not chase the trophy — execute <em>this</em> play, to standard, then the next. The trophies followed precisely because they were not the target.</p></div>
  <div class="cf"><div class="cft"><span>Three Super Bowls as coach</span><span class="nm">Bill Walsh</span></div><p>His philosophy, and the title of his book, was "The Score Takes Care of Itself." Build the standard of performance; the wins are a byproduct, never the aim.</p></div>
  <div class="cf"><div class="cft"><span>POW, eight years</span><span class="nm">The Stockdale Paradox</span></div><p>Admiral James Stockdale survived years of captivity by holding two things at once: unflinching acceptance of the brutal facts he could not control, <em>and</em> absolute faith he would prevail. Effort and surrender, in the same chest. That is 2.47, lived under torture.</p></div>
  <span class="pn l">19</span>
</div>`,
`<div class="p">
  <div class="rh"><span>Chapter 7</span><span>Part II · The Operating System</span></div>
  <div class="cn">7</div>
  <h2 class="ct">The Two Roads of Knowing</h2>
  <div class="cs">sāṅkhya and bhakti — head and heart</div>
  <p class="b">Kṛṣṇa lays out two different routes up the same mountain. A driven person should understand the difference — because most of us instinctively reach for the wrong one.</p>
  <div class="kw"><div class="kt">sāṅkhya</div><div class="kd">The path of analytic knowledge — discriminating the eternal self from the temporary body and mind through study and reason. Real and powerful. But the long way around.</div></div>
  <p class="b">The first road is sāṅkhya — cold, clear analysis. It is the philosopher's road: the path of understanding your way to peace, thinking yourself into equanimity, winning serenity the way you won everything else — by being smarter.</p>
  <div class="kw"><div class="kt">bhakti (bhak-ti)</div><div class="kd">Loving devotional service to God — the direct path of the heart, held to be the highest and most accessible of all yogas. Open to anyone, regardless of intellect or credential.</div></div>
  <p class="b">The second road is bhakti — devotion, love, a direct personal relationship with the source. And here is the unexpected verdict the Gītā is built to deliver: Kṛṣṇa says this second road is both <em>higher</em> and paradoxically <em>easier.</em> More direct. More available to anyone.</p>
  <span class="pn r">20</span>
</div>`
);

// ── SPREAD 11: CH.7 CONT + PART III ─────────────────────────
add(
`<div class="p">
  <div class="rh"><span>Chapter 7 · continued</span><span>The Two Roads of Knowing</span></div>
  <p class="b">The Gītā's quiet correction to the ambitious mind: you cannot think your way into love, or analyse your way into trust, or reason your way to a settled heart. At some point the charioteer (intelligence) has to do something other than calculate — it has to point the whole chariot toward something worth giving itself to. That act is bhakti.</p>
  <p class="b">There is a reason this is the more accessible road. The analytic path demands leisure, training, a certain kind of mind, and years. The devotional path demands only sincerity, which is distributed regardless of IQ, credential, or net worth. A child can walk it. So can a CEO — though the CEO often finds it harder, precisely because surrender is the one move a high-achieving intellect has spent a lifetime refusing to make.</p>
  <div class="pq"><p>"Knowledge without devotion is dry. It is like a desert. Add the water of devotion, and the same knowledge becomes a fertile field."</p><cite>— Śrīla Prabhupāda</cite></div>
  <p class="b">Hold the two together and you have the complete instrument: the clarity of the analyst, warmed by the commitment of the devotee. Knowing, plus loving what you know. Part III is where that combination stops being a description and becomes a daily practice.</p>
  <span class="pn l">21</span>
</div>`,
`<div class="p dm" style="display:flex;flex-direction:column;justify-content:center;min-height:100%;position:relative">
  <div class="rdeco">III</div>
  <div class="pl">Part III</div>

`<div class="p">
  <div class="rh"><span>Chapter 8</span><span>Part III · The Protocol</span></div>
  <div class="cn">8</div>
  <h2 class="ct">Work Like a Master</h2>
  <div class="cs">karma-yoga — full effort, released outcome</div>
  <p class="b"><span class="sk">Karma-yoga</span> is the union of two things that sound like opposites: total effort and total detachment from the result. How do you try your absolute hardest at something you have stopped needing to win? It sounds like a riddle. It is the exact mental stance behind nearly every description of elite performance ever written.</p>
  <p class="b">Consider what attachment to the outcome actually does to performance. It splits your attention between the task in front of you and an imagined future you cannot control. It floods the body with the chemistry of threat. It makes you tight, risk-averse, prone to the unforced error. The clutch is not extra focus — it is <em>divided</em> focus wearing the costume of focus.</p>
  <p class="b">Releasing the outcome does not make you slack. It returns your entire bandwidth to the one place it can do any good: the action directly in front of you. The detached operator is not the lazy one. He is the dangerous one, because nothing is left over to be afraid with.</p>
  <div class="kw"><div class="kt">karma-yoga</div><div class="kd">The discipline of acting with full effort while renouncing attachment to results — work performed as an offering rather than a transaction. The mechanism: pour everything into the action, and release the outcome to something larger than the ego's scoreboard.</div></div>
  <span class="pn l">23</span>
</div>`,
`<div class="p">
  <div class="rh"><span>Chapter 8 · continued</span><span>Work Like a Master</span></div>
  <p class="b">The tradition adds a move that pure sports psychology lacks. It does not ask you to release the result into a vacuum — which is hard, and which the mind resists, because the mind wants the result <em>somewhere.</em> It asks you to offer the work itself as service to something larger than your ego's scoreboard. For a believer, that is Kṛṣṇa. For a skeptic, it can begin as the craft itself, the team, the customer, the mission.</p>
  <div class="vb"><div class="vi">yat karoṣi yad aśnāsi · yaj juhoṣi dadāsi yat</div><div class="vt">"Whatever you do, whatever you eat, whatever you offer or give away, and whatever austerities you perform — do that as an offering to Me."</div><div class="vr">Bhagavad-gītā 9.27</div></div>
  <p class="b">The mechanism is identical either way: when the work is an offering rather than a verdict on your worth, the fear drains out of it, and what remains is pure skill, fully applied.</p>
  <div class="pq"><p>"Do your duty to the very best of your ability, and leave the result to Kṛṣṇa. Then there is no anxiety. The result will come of its own accord."</p><cite>— Śrīla Prabhupāda</cite></div>
  <span class="pn r">24</span>
</div>`

`<div class="p">

  <h2 class="ct">When Trying Less Works Better</h2>
  <div class="cs">effort and surrender, observed under maximum pressure</div>
  <p class="b">The paradox of karma-yoga is testable, and it has been tested — on ranges, on free-throw lines, and in operating theatres.</p>
  <div class="cf"><div class="cft"><span>Zen in the Art of Archery</span><span class="nm">Eugen Herrigel</span></div><p>The German philosopher spent six years learning Japanese archery and discovered the master's single instruction: stop aiming at the target. The arrow must release itself, "like snow sliding from a leaf." Attachment to hitting was the thing that made him miss. 2.47, with a bow.</p></div>
  <div class="cf"><div class="cft"><span>The free-throw under pressure</span><span class="nm">Sports psychology</span></div><p>Decades of research on "choking" converge on one finding: when the stakes spike, attention floods to the outcome, the body tightens, and a movement the athlete has performed a million times suddenly fails. The cure taught everywhere is the same — return attention to the process cue, release the result.</p></div>
  <div class="cf"><div class="cft"><span>The operating theatre</span><span class="nm">Elite surgeons</span></div><p>The calmest hands in the highest-stakes room are not the ones who care least. They are the ones who have learned to pour total attention into the next incision and let the larger outcome go — because anything left over for fear is taken from the cut.</p></div>
  <span class="pn r">26</span>
</div>`

  <p class="b">Everyone now agrees you ought to meditate. Far fewer actually do, and the reason is honest: sitting and watching your breath is boring, and the mind escapes within seconds. Kṛṣṇa names the difficulty exactly — the mind is "restless, turbulent, obstinate and very strong; to subdue it is more difficult than controlling the wind" (Gītā 6.34).</p>

`<div class="p">

  <p class="b">The whole seven hundred verses resolve into a single final instruction. After every argument, every analysis, every road mapped, Kṛṣṇa says the one thing that ends Arjuna's paralysis — not "understand more," but "let go and trust."</p>
  <div class="vb"><div class="vi">sarva-dharmān parityajya · mām ekaṁ śaraṇaṁ vraja</div><div class="vt">"Abandon all varieties of duty and simply surrender unto Me. I shall deliver you from all sinful reactions. Do not fear."</div><div class="vr">Bhagavad-gītā 18.66 — Kṛṣṇa's last word to Arjuna</div></div>
  <p class="b">And it works. The book that opened with the greatest warrior of his age collapsed in his chariot, unable to lift his bow, closes three words later: Arjuna says, "I will act according to Your word." The paralysis is gone. He stands up. He fights — not from rage, not from greed, but from clarity, with the result released.</p>
  <p class="b">That is the entire promise of the text, in one before-and-after: a capable person, frozen by the weight of outcomes he cannot control, talked back onto his feet and into full action. Everything in this book is a footnote to that single arc.</p>

// ═══════════════════════════════════════════
//  FLIPBOOK ENGINE
// ═══════════════════════════════════════════
const lp=document.getElementById('lp'),rp=document.getElementById('rp');
const fl=document.getElementById('fl'),ffr=document.getElementById('ffr'),fbk=document.getElementById('fbk');
const pb=document.getElementById('pb'),nb=document.getElementById('nb'),ctr=document.getElementById('ctr'),pf=document.getElementById('pf');
let cur=0,busy=false;
const N=S.length;
const mob=()=>window.innerWidth<=640;

function render(i){
  lp.innerHTML=S[i].l;
  rp.innerHTML=S[i].r;
  upd(i);
}

function upd(i){
  ctr.textContent=`${i+1} / ${N}`;
  pf.style.width=`${((i+1)/N)*100}%`;
  pb.disabled=i<=0;
  nb.disabled=i>=N-1;
}

function goNext(){
  if(cur>=N-1||busy)return;
  if(mob()){cur++;render(cur);window.scrollTo({top:0,behavior:'smooth'});return;}
  busy=true;
  ffr.innerHTML=S[cur].r;
  fbk.innerHTML=S[cur+1].l;
  rp.innerHTML=S[cur+1].r;
  fl.style.transition='none';
  fl.style.transform='rotateY(0deg)';
  fl.style.display='block';
  fl.offsetHeight;
  fl.style.transition='transform 0.78s cubic-bezier(0.4,0,0.2,1)';
  fl.style.transform='rotateY(-180deg)';
  fl.addEventListener('transitionend',function h(){
    fl.removeEventListener('transitionend',h);
    cur++;
    lp.innerHTML=S[cur].l;
    fl.style.display='none';
    fl.style.transform='';
    fl.style.transition='';
    busy=false;
    upd(cur);
  });
}

function goBack(){
  if(cur<=0||busy)return;
  if(mob()){cur--;render(cur);window.scrollTo({top:0,behavior:'smooth'});return;}
  busy=true;
  ffr.innerHTML=S[cur-1].r;
  fbk.innerHTML=S[cur].l;
  lp.innerHTML=S[cur-1].l;
  rp.innerHTML=S[cur-1].r;
  fl.style.transition='none';
  fl.style.transform='rotateY(-180deg)';
  fl.style.display='block';
  fl.offsetHeight;
  fl.style.transition='transform 0.78s cubic-bezier(0.4,0,0.2,1)';
  fl.style.transform='rotateY(0deg)';
  fl.addEventListener('transitionend',function h(){
    fl.removeEventListener('transitionend',h);
    cur--;
    rp.innerHTML=S[cur].r;
    fl.style.display='none';
    fl.style.transform='';
    fl.style.transition='';
    busy=false;
    upd(cur);
  });
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')goNext();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')goBack();
});

document.getElementById('lp').closest('.pa').addEventListener('click',goBack);
document.getElementById('rp').closest('.pa').addEventListener('click',goNext);

// Swipe support for mobile
let _tx=0,_ty=0;
document.addEventListener('touchstart',e=>{_tx=e.touches[0].clientX;_ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx;
  const dy=e.changedTouches[0].clientY-_ty;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>44){
    dx<0?goNext():goBack();
  }
},{passive:true});

render(0);
</script>
